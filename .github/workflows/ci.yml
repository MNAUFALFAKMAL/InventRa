name: CI

on:
  push:
    branches: [ main, develop, 'project/123140062_123140132_InventRa', 'sprint5' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup local.properties
        run: |
          echo "GEMINI_API_KEY=dummy_for_ci" >> local.properties
          echo "SUPABASE_URL=https://dummy.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=dummy_anon_key" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=dummy_service_key" >> local.properties
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Run Unit Tests
        run: |
          ./gradlew :composeApp:testDebugUnitTest --stacktrace