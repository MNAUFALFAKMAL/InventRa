name: CI

on:
  push:
    branches: [ main, develop, 'project/123140062_123140132_InventRa' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (Android)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Buat local.properties agar build tidak gagal karena missing file
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "GEMINI_API_KEY=" >> local.properties

      # 4. Generate Gradle Wrapper otomatis di server GitHub (Bypass Git lokal)
      - name: Generate Gradle Wrapper
        run: gradle wrapper

      # 5. Izinkan gradlew dieksekusi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Cache Gradle & KMP Native dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 7. Run unit tests (commonTest + androidTest)
      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      # 8. Build APK debug
      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      # 9. Upload APK sebagai artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inventra-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7