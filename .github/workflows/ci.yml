name: Build and Release InventRa

on:
  push:
    branches: [ main, develop, 'project/123140062_123140132_InventRa', 'sprint5' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup local.properties
        run: |
          echo "GEMINI_API_KEY=dummy_for_ci" >> local.properties
          echo "SUPABASE_URL=https://dummy.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=dummy_anon_key" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=dummy_service_key" >> local.properties

      - name: Build Android Release APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --no-daemon --quiet --stacktrace
      
      - name: Stop Gradle
        run: ./gradlew --stop

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: InventRa-Android
          path: composeApp/build/outputs/apk/release/InventRa-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup local.properties
        run: |
          echo "GEMINI_API_KEY=dummy_for_ci" >> local.properties
          echo "SUPABASE_URL=https://dummy.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=dummy_anon_key" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=dummy_service_key" >> local.properties

      - name: Build iOS Framework
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --quiet --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

      - name: Zip iOS Framework
        run: |
          cd composeApp/build/bin/iosArm64/releaseFramework/
          zip -r ../../../../InventRa-iOS-Framework.zip ComposeApp.framework
          
      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: InventRa-iOS
          path: InventRa-iOS-Framework.zip

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: InventRa-Android

      - name: Download iOS Framework
        uses: actions/download-artifact@v4
        with:
          name: InventRa-iOS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*.apk"
          name: InventRa App
          body: |
            ## 📦 InventRa Stable Release
            
            Solusi inventaris digital cerdas untuk HMIF ITERA.
            
            ### ✨ Fitur Utama
            - 🤖 **AI Assistant** (Google Gemini)
            - 🔄 **Hybrid Sync** (SQLDelight + Supabase)
            - 🔐 **Multi-Role Access** (Admin & Member)
            
            ### 📲 Instalasi Android
            1. Unduh `InventRa-release.apk`.
            2. Instal di perangkat Android Anda.
            
            ### 🍎 Catatan iOS
            Untuk iOS, kami menyediakan `InventRa-iOS-Framework.zip`. File ini adalah framework untuk digunakan oleh developer di Xcode. (File `.ipa` memerlukan akun Apple Developer resmi).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
