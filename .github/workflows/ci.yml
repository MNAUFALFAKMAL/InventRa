name: Build and Release InventRa

on:
  push:
    branches: [ main, develop, 'project/123140062_123140132_InventRa', 'sprint5' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup local.properties
        run: |
          echo "GEMINI_API_KEY=dummy_for_ci" >> local.properties
          echo "SUPABASE_URL=https://dummy.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=dummy_anon_key" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=dummy_service_key" >> local.properties

      - name: Build Android Release APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: InventRa-Android
          path: composeApp/build/outputs/apk/release/InventRa-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup local.properties
        run: |
          echo "GEMINI_API_KEY=dummy_for_ci" >> local.properties
          echo "SUPABASE_URL=https://dummy.supabase.co" >> local.properties
          echo "SUPABASE_ANON_KEY=dummy_anon_key" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=dummy_service_key" >> local.properties

      - name: Build iOS Framework
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Zip iOS Framework
        run: |
          find composeApp/build -name "*.framework" -type d -exec zip -r InventRa-iOS-Framework.zip {} +
          
      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: InventRa-iOS
          path: InventRa-iOS-Framework.zip
