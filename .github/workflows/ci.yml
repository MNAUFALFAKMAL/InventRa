name: CI

on:
  push:
    branches: [ main, develop, 'project/123140062_123140132_InventRa' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (Android)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Gradle (Menggantikan validasi manual & membuat wrapper jika hilang)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7' # Sesuaikan dengan versi yang ada di gradle-wrapper.properties
          cache-read-only: false

      # 4. Buat local.properties agar build tidak gagal karena missing file
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "GEMINI_API_KEY=" >> local.properties

      # 5. Izinkan gradlew dieksekusi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Run unit tests (commonTest + androidTest)
      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      # 7. Build APK debug
      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      # 8. Upload APK sebagai artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inventra-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7