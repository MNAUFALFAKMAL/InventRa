name: Build Project

on:
  push:
    branches: [ main, develop, 'project/123140062_123140132_InventRa' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gunakan action ini karena ia TIDAK memvalidasi wrapper .jar
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug