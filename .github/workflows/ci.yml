name: Build and Release InventRa

on:
  push:
    branches: [ main, develop, 'project/123140062_123140132_InventRa', 'sprint5' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties

      - name: Build Android Release APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --no-daemon --quiet --stacktrace
      
      - name: Stop Gradle
        run: ./gradlew --stop

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: InventRa-Android
          path: composeApp/build/outputs/apk/release/InventRa-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties

      - name: Build iOS Framework
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon --quiet --stacktrace

      - name: Stop Gradle
        run: ./gradlew --stop

      - name: Zip iOS Framework
        run: |
          # Mencari framework secara rekursif agar lebih aman
          find composeApp/build/bin/iosArm64 -name "*.framework" -type d -exec zip -r InventRa-iOS-Framework.zip {} + || echo "Framework not found"
          
      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: InventRa-iOS
          path: InventRa-iOS-Framework.zip
          if-no-files-found: warn

  release-android:
    name: Release Android APK
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: InventRa-Android
          path: .

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          name: InventRa App
          body: |
            ## 📦 InventRa Stable Release
            
            Solusi inventaris digital cerdas untuk HMIF ITERA.
            
            ### ✨ Fitur Utama
            - 🤖 **AI Assistant** (Google Gemini)
            - 🔄 **Hybrid Sync** (SQLDelight + Supabase)
            - 🔐 **Multi-Role Access** (Admin & Member)
            
            ### 📲 Instalasi Android
            1. Unduh `InventRa-release.apk`.
            2. Instal di perangkat Android Anda.
            
            *Catatan: File iOS sedang dalam proses build dan akan muncul otomatis di sini jika sudah selesai.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-ios:
    name: Attach iOS Framework
    needs: [build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS Framework
        uses: actions/download-artifact@v4
        with:
          name: InventRa-iOS
          path: .

      - name: Update Release with iOS
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
